[package]
name = "steam-frame-6ghz-tool"
autobins = false
version = "0.4.2"
edition = "2024"
rust-version = "1.98"
description = "Steam Frame 6 GHz 设置工具"
license = "MIT"

[[bin]]
name = "steam-frame-6ghz-tool"
path = "src/gpui_entry.rs"

[dependencies]
base64 = "0.23"
gpui-kit = "=0.6.6"
rfd = "=0.16.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
ssh2 = "0.9.6"
ureq = { version = "3.4", features = ["json", "win-system-proxy"] }
zeroize = "1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_System_LibraryLoader", "Win32_System_Services", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winres = "0.1.12"

[dev-dependencies]
gpui-kit = { version = "=0.6.6", features = ["test-support"] }

[profile.release]
strip = true
lto = "fat"
opt-level = "z"
codegen-units = 1
