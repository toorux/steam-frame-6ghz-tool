name: Build and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v0.1.0-preview.1)'
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RUSTUP_TOOLCHAIN: 1.98.0-x86_64-pc-windows-msvc
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component clippy

      - name: Check release version
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = ($metadata | ConvertFrom-Json).packages | Where-Object name -eq 'steam-frame-6ghz-tool'
          if ($env:RELEASE_TAG -cne "v$($package.version)") {
            throw 'Tag must match the Cargo.toml version (for example v0.1.0).'
          }

      - name: Test
        run: cargo test --locked

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build Windows x64
        run: cargo build --release --locked

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $exe = 'target/release/steam-frame-6ghz-tool.exe'
          $checksum = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  steam-frame-6ghz-tool.exe" | Set-Content -LiteralPath 'SHA256SUMS.txt' -Encoding ascii
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, $exe, 'SHA256SUMS.txt', '--verify-tag', '--generate-notes', '--title', "Steam Frame 6 GHz 设置工具 $env:RELEASE_TAG")
          if ($env:RELEASE_TAG.Contains('-')) { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
